<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rous Barber · Reserva tu cita</title>
<meta name="description" content="Reserva tu cita en Rous Barber Barbería en segundos.">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="image.jpg">
<link rel="apple-touch-icon" href="image.jpg">
<meta property="og:image" content="image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080a; --card: #13161b; --card2: #1d2128; --line: #2b313b;
    --txt: #f2f4f7; --sub: #a8b3c2; --acc: #e3b23c; --acc-txt: #1a1405;
    --ok: #2fbf71; --err: #ff6b6b; --wa: #25d366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 Inter, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  header { padding: 22px 16px 8px; text-align: center; background:
    linear-gradient(90deg, #6b5420, #e3b23c, #6b5420) top / 100% 4px no-repeat; }
  .logo { margin: 6px auto 0; }
  .logo img { width: min(220px, 56vw); height: auto; display: block; margin: 0 auto; border-radius: 12px; }
  .lema { color: var(--sub); font-size: 13px; margin-top: 2px; }

  nav { position: sticky; top: 0; z-index: 5; background: rgba(1,1,1,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; gap: 6px; padding: 10px 16px; }
  nav button { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
  nav button.on { background: var(--acc); color: var(--acc-txt); }

  h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 26px; margin: 22px 0 10px; }
  h2 small { font-family: Inter, sans-serif; font-size: 13px; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
  .grid { display: grid; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
         background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .opt b { font-weight: 600; }
  .opt .meta { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .opt-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .opt .desc { color: var(--sub); font-size: 13px; font-weight: 400; }
  .opt.on { border-color: var(--acc); background: #2a2110; }
  .barb { display: flex; gap: 12px; align-items: center; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
  .barb.on { border-color: var(--acc); background: #2a2110; }
  .barb .foto { flex: 0 0 60px; width: 60px; height: 60px; border-radius: 50%; background: #1d2128 center / cover no-repeat; border: 2px solid var(--acc);
                display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; color: var(--acc); }
  .barb .datos { flex: 1; min-width: 0; }
  .barb .datos b { display: block; font-size: 16px; }
  .barb .dir { color: var(--sub); font-size: 13px; }
  .mapa { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--acc); text-decoration: none; border: 1px solid #6b5420; border-radius: 8px; padding: 4px 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-width: 64px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; }
  .chip small { display: block; color: var(--sub); font-size: 11px; text-transform: uppercase; }
  .chip b { font-size: 18px; }
  .chip.on { border-color: var(--acc); background: #2a2110; }
  .chip:disabled { opacity: .35; cursor: default; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .horas .chip { min-width: 0; padding: 10px 4px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  input { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
  input:focus { border-color: var(--acc); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 16px; cursor: pointer;
         background: var(--acc); color: var(--acc-txt); margin-top: 16px; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--card2); color: var(--txt); }
  .btn.wa { background: var(--wa); color: #06210f; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .resumen div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .resumen div:last-child { border: 0; }
  .resumen span { color: var(--sub); }
  .ok { border-color: #1f6b43; background: #10261a; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; }
  .muted { color: var(--sub); font-size: 13px; }
  .codigo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 40px; letter-spacing: 2px; color: var(--acc); line-height: 1.1; }
  .aviso { border: 1px solid #6b5420; background: #1d170b; color: #f0dca8; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-top: 22px; }
  .plan h3 { margin: 0; font-size: 18px; }
  .plan .precio { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 34px; color: var(--acc); line-height: 1; margin: 6px 0; }
  .plan ul { margin: 8px 0 0; padding-left: 18px; color: var(--sub); }
  .info { color: var(--sub); font-size: 13px; text-align: center; margin-top: 28px; }
  .info a { color: var(--sub); }
  .soporte { position: fixed; right: 16px; bottom: 18px; z-index: 6; background: var(--wa); color: #06210f; border-radius: 30px; padding: 12px 16px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .cargando { color: var(--sub); padding: 30px 0; text-align: center; }
  .carrusel { position: relative; margin-top: 10px; }
  .pista { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 14px; background: var(--card); }
  .pista::-webkit-scrollbar { display: none; }
  .pista img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 5; max-height: 560px; object-fit: cover; scroll-snap-align: center; display: block; }
  .pista.vacia { justify-content: center; align-items: center; aspect-ratio: 4 / 5; max-height: 560px; color: var(--sub); font-size: 14px; }
  .flecha { position: absolute; top: calc(50% - 12px); transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; }
  .flecha.izq { left: 8px; } .flecha.der { right: 8px; }
  .puntos { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .puntos span { width: 7px; height: 7px; border-radius: 50%; background: #444; }
  .puntos span.on { background: var(--acc); }
  .link { background: none; border: 0; color: var(--acc); cursor: pointer; padding: 10px 0 0; font-weight: 600; font-size: 14px; }
  .hidden { display: none !important; }
  .regalo { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px; margin-top: 12px; border: 1px solid #6b5420;
            background: radial-gradient(120% 90% at 85% 0%, #3a2a0c 0%, #14110a 55%, #0b0b0d 100%); }
  .regalo .marca { display: flex; align-items: center; gap: 10px; }
  .regalo .marca img { width: 44px; height: 44px; border-radius: 10px; }
  .regalo .marca span { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 2px; color: var(--acc); font-size: 18px; }
  .regalo .para { font-size: 13px; color: var(--sub); margin-top: 18px; }
  .regalo .para b { color: var(--txt); font-size: 20px; display: block; margin-top: 2px; }
  .regalo .serv { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 34px; letter-spacing: 1px; color: var(--acc); line-height: 1.05; margin-top: 12px; }
  .regalo .msg { font-style: italic; margin-top: 10px; color: #efe6cf; }
  .regalo .pie { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 12px; border-top: 1px dashed #6b5420; font-size: 13px; color: var(--sub); }
  .regalo .cod { font-family: ui-monospace, Menlo, monospace; color: var(--txt); font-size: 15px; letter-spacing: 1px; }
  .banner-bono { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #6b5420; background: #1d170b; border-radius: 12px; padding: 10px 12px; margin-top: 16px; font-size: 14px; }
  .banner-bono button { background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer; font-size: 13px; }
  textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; font: inherit; color: inherit; resize: vertical; min-height: 70px; }
  textarea:focus { border-color: var(--acc); }
  .combo { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--acc-txt); background: var(--acc); border-radius: 6px; padding: 1px 6px; vertical-align: 2px; }
  .ahorro { color: var(--ok); font-size: 13px; font-weight: 600; }
  .opt .meta s { color: var(--sub); font-weight: 400; }
  @media (prefers-reduced-motion: no-preference) { .vista { animation: entra .18s ease-out; } @keyframes entra { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<header>
  <h1 class="logo"><img src="image.jpg" alt="Rous Barber Barbería" width="220" height="220"></h1>
  <div class="lema" id="lema"></div>
</header>
<nav><div class="wrap">
  <button data-tab="reservar" class="on">Reservar</button>
  <button data-tab="micita">Mi cita</button>
  <button data-tab="regalar">Regalar</button>
  <button data-tab="planes">Planes</button>
</div></nav>

<main class="wrap">
  <section id="v-reservar" class="vista"><div class="cargando">Cargando…</div></section>
  <section id="v-micita" class="vista hidden"></section>
  <section id="v-regalar" class="vista hidden"></section>
  <section id="v-planes" class="vista hidden"></section>

  <div class="aviso"><b>Aviso:</b> Rous Barber nunca te pide datos de tu banco. Las citas se pagan en la barbería; solo los bonos de regalo se pagan antes, y únicamente por los datos que aparecen aquí. Si alguien te escribe desde otro número pidiendo dinero, no es nosotros.</div>
  <div class="info" id="info"></div>
</main>
<a class="soporte hidden" id="soporte" target="_blank" rel="noopener">WhatsApp</a>

<script>
/* Dirección de la API (Apps Script → Implementar → Aplicación web). */
const API = 'https://script.google.com/macros/s/AKfycbyOH-D6nQruokCsfvtYVyz5j4YkTn3ClHR5w5UovH71XNlfLiU7svs5-PZOicZfKbsH/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = v => '$' + Math.round(v || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leerLS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

let D = null;               // datos del negocio
const R = { barbero: null, servicio: null, fecha: null, hora: null, bono: null };

/* Llamadas a la API con reintentos (tras publicar, Google responde error unos minutos). */
async function api(params, post) {
  let ultimo;
  for (let i = 0; i < 5; i++) {
    try {
      const r = post
        ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params) })
        : await fetch(API + '?' + new URLSearchParams(params));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.final = true; throw e; }
      return j;
    } catch (e) {
      if (e.final) throw e;
      ultimo = e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
  throw new Error('No pudimos conectar. Revisa tu internet e inténtalo de nuevo.');
}

const waLink = (tel, txt) => 'https://wa.me/' + tel + '?text=' + encodeURIComponent(txt);
function fechaISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function deISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function cerrado(h) { return !/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(String(h).trim()); }
function hora12(h) { const [a, b] = h.split(':').map(Number); return (a % 12 || 12) + ':' + String(b).padStart(2, '0') + (a < 12 ? ' a. m.' : ' p. m.'); }

/* ---------- Pestañas ---------- */
function tab(nombre) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === nombre));
  ['reservar', 'micita', 'regalar', 'planes'].forEach(t => $('#v-' + t).classList.toggle('hidden', t !== nombre));
  if (nombre === 'regalar') vistaRegalar();
  if (nombre === 'micita' && !$('#v-micita').innerHTML) vistaMiCita();
  if (nombre === 'planes') vistaPlanes();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- Reservar ---------- */
let FOTOS = leerLS('fotos') || {}; // { B01: { v: versión, src: 'data:image/...' } }

function fotoHtml(b) {
  const f = FOTOS[b.id];
  const ok = b.foto && f && f.v === b.foto && /^data:image\//.test(f.src);
  return ok
    ? `<div class="foto" data-foto="${esc(b.id)}" role="img" aria-label="Foto de ${esc(b.nombre)}" style="background-image:url('${f.src}')"></div>`
    : `<div class="foto" data-foto="${esc(b.id)}" aria-hidden="true">${esc(String(b.nombre || '?').trim().charAt(0).toUpperCase())}</div>`;
}

async function cargarFotos() {
  const falta = D.barberos.some(b => b.foto && (!FOTOS[b.id] || FOTOS[b.id].v !== b.foto));
  if (!falta) return;
  try {
    const r = await api({ a: 'fotos' });
    const nuevo = {};
    D.barberos.forEach(b => { if (b.foto && r.fotos[b.id]) nuevo[b.id] = { v: b.foto, src: r.fotos[b.id] }; });
    FOTOS = nuevo;
    guardar('fotos', FOTOS);
    document.querySelectorAll('[data-foto]').forEach(el => {
      const b = D.barberos.find(x => x.id === el.dataset.foto);
      if (b) el.outerHTML = fotoHtml(b);
    });
  } catch (e) { /* sin fotos, quedan las iniciales */ }
}

const mapaBtn = b => b.mapa ? `<a class="mapa" href="${esc(b.mapa)}" target="_blank" rel="noopener" data-mapa>Cómo llegar ↗</a>` : '';

const GAL = {}; // fotos de trabajos por barbero: id -> [{ id, src }] | 'cargando'

function galeriaHtml(b) {
  const f = GAL[b.id];
  if (f === undefined) cargarGaleria(b);
  if (!Array.isArray(f)) return '<div class="pista vacia">Cargando fotos…</div>';
  if (!f.length) return '';
  return `<div class="pista" id="pista" tabindex="0" aria-label="Trabajos de ${esc(b.nombre)}">${f.map((x, i) =>
      `<img src="${x.src}" alt="Trabajo ${i + 1} de ${esc(b.nombre)}"${i ? ' loading="lazy"' : ''}>`).join('')}</div>` +
    (f.length > 1 ? `<button class="flecha izq" data-dir="-1" aria-label="Foto anterior">‹</button><button class="flecha der" data-dir="1" aria-label="Foto siguiente">›</button>
      <div class="puntos">${f.map((x, i) => `<span class="${i ? '' : 'on'}"></span>`).join('')}</div>` : '');
}

async function cargarGaleria(b) {
  GAL[b.id] = 'cargando';
  try { const r = await api({ a: 'galeria', b: b.id }); GAL[b.id] = r.fotos.filter(x => /^data:image\//.test(x.src)); }
  catch (e) { GAL[b.id] = []; }
  const caja = $('#galeria');
  if (R.barbero === b.id && caja) {
    if (GAL[b.id].length) { caja.innerHTML = galeriaHtml(b); iniciarCarrusel(); } else caja.remove();
  }
}

function iniciarCarrusel(pos) {
  const p = $('#pista');
  if (!p) return;
  if (pos) p.scrollLeft = pos;
  const puntos = document.querySelectorAll('.puntos span');
  const actual = () => Math.round(p.scrollLeft / (p.clientWidth || 1));
  const marcar = () => puntos.forEach((s, i) => s.classList.toggle('on', i === actual()));
  p.onscroll = marcar;
  marcar();
  document.querySelectorAll('.flecha').forEach(b => b.onclick = () => {
    const n = p.children.length, i = (actual() + Number(b.dataset.dir) + n) % n;
    p.scrollTo({ left: i * p.clientWidth, behavior: 'smooth' });
  });
}

function vistaReservar() {
  const v = $('#v-reservar');
  const hace = b => (b.servicios || []).indexOf(R.bono ? R.bono.servicioId : '') >= 0;
  if (R.bono && R.barbero && !hace(D.barberos.find(b => b.id === R.barbero) || {})) { R.barbero = null; R.fecha = null; R.hora = null; }
  const barb = D.barberos.find(b => b.id === R.barbero);
  let servs = barb ? D.servicios.filter(s => (barb.servicios || []).indexOf(s.id) >= 0) : [];
  if (R.bono) { servs = servs.filter(s => s.id === R.bono.servicioId); if (barb) R.servicio = R.bono.servicioId; }
  if (barb && R.servicio && !servs.some(s => s.id === R.servicio)) { R.servicio = null; R.hora = null; }
  const serv = servs.find(s => s.id === R.servicio);
  const lista = barb ? [barb] : (R.bono ? D.barberos.filter(hace) : D.barberos);
  let html = R.bono
    ? `<div class="banner-bono"><span>🎁 Reservando con el bono <b>${esc(R.bono.codigo)}</b>: ${esc(R.bono.servicio)}</span><button id="quitar-bono">Quitar</button></div>`
    : '<button class="link" id="tengo-bono">¿Tienes un bono de regalo?</button><div id="caja-bono"></div>';
  html += '<h2>1 · Barbero</h2><div class="grid">' + lista.map(b => `
    <div class="barb ${b.id === R.barbero ? 'on' : ''}" data-b="${esc(b.id)}" role="button" tabindex="0" aria-pressed="${b.id === R.barbero}">
      ${fotoHtml(b)}
      <div class="datos">
        <b>${esc(b.nombre)}</b>
        <div class="dir">${esc(b.direccion || D.direccion || '')}</div>
        ${mapaBtn(b)}
      </div>
    </div>`).join('') + '</div>';
  if (barb) html += '<button class="link" id="cambiar">← Ver todos los barberos</button>' + (barb.galeria ? '<div id="galeria" class="carrusel">' + galeriaHtml(barb) + '</div>' : '');
  if (barb) {
    html += '<h2 id="paso2">2 · Servicio</h2>' + (servs.length ? '<div class="grid">' + servs.map(s =>
      `<button class="opt ${s.id === R.servicio ? 'on' : ''}" data-s="${esc(s.id)}"><span class="opt-txt"><b>${esc(s.nombre)}${s.combo ? ' <span class="combo">Combo</span>' : ''}</b>${s.combo ? `<span class="desc">Incluye: ${esc(s.incluyeNombres.join(' + '))}</span>` : ''}${s.desc ? `<span class="desc">${esc(s.desc)}</span>` : ''}${s.combo && s.suelto > s.precio ? `<span class="ahorro">Ahorras ${pesos(s.suelto - s.precio)}</span>` : ''}</span><span class="meta">${s.combo && s.suelto > s.precio ? `<s>${pesos(s.suelto)}</s> ` : ''}${pesos(s.precio)} · ${s.dur} min</span></button>`).join('') + '</div>'
      : '<p class="muted">Este barbero todavía no tiene servicios disponibles.</p>');
  }
  if (serv) {
    html += '<h2>3 · Día</h2><div class="chips">';
    const hoy = deISO(D.hoy);
    for (let i = 0; i <= D.dias; i++) {
      const d = new Date(hoy); d.setDate(d.getDate() + i);
      const iso = fechaISO(d);
      const off = cerrado(D.horario[d.getDay()]);
      html += `<button class="chip ${iso === R.fecha ? 'on' : ''}" data-f="${iso}" ${off ? 'disabled' : ''}><small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : DIAS[d.getDay()]}</small><b>${d.getDate()}</b><small>${MESES[d.getMonth()]}</small></button>`;
    }
    html += '</div>';
  }
  if (serv && R.fecha) html += '<h2>4 · Hora</h2><div id="horas" class="cargando">Buscando horarios libres…</div>';
  if (serv && R.fecha && R.hora) {
    const yo = leerLS('cliente') || {};
    html += `<h2>5 · Tus datos</h2>
      <div class="card resumen">
        <div><span>Barbero</span><b>${esc(barb.nombre)}</b></div>
        <div><span>Dónde</span><b>${esc(barb.direccion || D.direccion || '')}</b></div>
        <div><span>Servicio</span><b>${esc(serv.nombre)}</b></div>
        <div><span>Cuándo</span><b>${esc(fechaLarga(R.fecha))}, ${hora12(R.hora)}</b></div>
        <div><span>Precio</span><b>${R.bono ? 'Bono de regalo · $0' : pesos(serv.precio)}</b></div>
      </div>
      <label for="nombre">Nombre</label><input id="nombre" autocomplete="name" value="${esc(yo.nombre || '')}" placeholder="Tu nombre">
      <label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(yo.tel || '')}" placeholder="300 123 4567">
      <div id="err" class="err"></div>
      <button class="btn" id="confirmar">Confirmar reserva</button>
      <p class="muted">${R.bono ? 'El servicio ya está pagado con tu bono.' : 'Pagas en la barbería.'} ${esc(D.advertencia)}</p>`;
  }
  const pistaPrev = $('#pista'), posPrev = pistaPrev ? pistaPrev.scrollLeft : 0;
  v.innerHTML = html;
  iniciarCarrusel(posPrev);
  if ($('#quitar-bono')) $('#quitar-bono').onclick = () => { R.bono = null; R.servicio = null; R.hora = null; vistaReservar(); };
  if ($('#tengo-bono')) $('#tengo-bono').onclick = () => {
    $('#caja-bono').innerHTML = `<label for="cod-bono">Código del bono</label><input id="cod-bono" placeholder="RB-XXXXXX" autocapitalize="characters">
      <div id="err-bono" class="err"></div><button class="btn sec" id="usar-bono">Usar bono</button>`;
    $('#usar-bono').onclick = async () => {
      const b = $('#usar-bono'); b.disabled = true; $('#err-bono').textContent = '';
      try { await aplicarBono($('#cod-bono').value); } catch (e) { b.disabled = false; $('#err-bono').textContent = e.message; }
    };
  };
  if ($('#cambiar')) $('#cambiar').onclick = () => { R.barbero = null; R.servicio = null; R.fecha = null; R.hora = null; vistaReservar(); };
  v.querySelectorAll('[data-b]').forEach(el => {
    const elegir = () => {
      const cambio = R.barbero !== el.dataset.b;
      if (cambio) { R.barbero = el.dataset.b; R.servicio = null; R.fecha = null; R.hora = null; }
      vistaReservar();
      if (cambio) setTimeout(() => { const p = $('#v-reservar'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    };
    el.onclick = e => { if (!e.target.closest('[data-mapa]')) elegir(); };
    el.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('[data-mapa]')) { e.preventDefault(); elegir(); } };
  });
  v.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { R.servicio = b.dataset.s; R.hora = null; vistaReservar(); });
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { R.fecha = b.dataset.f; R.hora = null; vistaReservar(); });
  if (serv && R.fecha) cargarHoras();
  if ($('#confirmar')) $('#confirmar').onclick = confirmar;
}

function fechaLarga(iso) {
  const d = deISO(iso);
  const n = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()];
  return n + ' ' + d.getDate() + ' de ' + ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()];
}

let pedidoHoras = 0;
async function cargarHoras() {
  const n = ++pedidoHoras;
  const caja = $('#horas');
  try {
    const r = await api({ a: 'libres', fecha: R.fecha, barbero: R.barbero, servicio: R.servicio });
    if (n !== pedidoHoras || !$('#horas')) return;
    if (!r.libres.length) { caja.className = 'muted'; caja.textContent = 'No quedan horarios libres ese día. Prueba otro día u otro barbero.'; return; }
    caja.className = 'horas';
    caja.innerHTML = r.libres.map(s => `<button class="chip ${s.hora === R.hora ? 'on' : ''}" data-h="${s.hora}">${hora12(s.hora).replace(' ', '&nbsp;')}</button>`).join('');
    caja.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
      R.hora = b.dataset.h; vistaReservar();
      setTimeout(() => { const el = $('#nombre'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
    });
  } catch (e) {
    if (n === pedidoHoras && $('#horas')) { caja.className = 'err'; caja.textContent = e.message; }
  }
}

async function confirmar() {
  const nombre = $('#nombre').value.trim(), tel = $('#tel').value.replace(/\D/g, '');
  if (nombre.length < 2) return ($('#err').textContent = 'Escribe tu nombre.');
  if (tel.length < 10) return ($('#err').textContent = 'Escribe tu número de WhatsApp (10 dígitos).');
  const btn = $('#confirmar'); btn.disabled = true; btn.textContent = 'Reservando…'; $('#err').textContent = '';
  try {
    const r = await api({ a: 'reservar', nombre, tel, servicio: R.servicio, barbero: R.barbero, fecha: R.fecha, hora: R.hora, bono: R.bono ? R.bono.codigo : '' }, true);
    R.bono = null;
    guardar('cliente', { nombre, tel });
    guardar('ultimaCita', { cita: r.cita, t: r.tel });
    const enlace = location.origin + location.pathname + '?cita=' + r.cita + '&t=' + r.tel;
    const waDest = r.waBarbero || D.whatsapp;
    const msg = 'Hola' + (r.waBarbero ? ' ' + r.barbero : '') + ', reservé en ' + D.negocio + ': ' + r.servicio + ' el ' + r.fechaTxt + ' a las ' + r.hora12 + ' con ' + r.barbero + '. Código ' + r.cita + '.';
    $('#v-reservar').innerHTML = `
      <h2>¡Reserva recibida!</h2>
      <div class="card ok">
        <div class="muted">Tu código</div><div class="codigo">${esc(r.cita)}</div>
        <div class="resumen" style="margin-top:8px">
          <div><span>Servicio</span><b>${esc(r.servicio)}</b></div>
          <div><span>Barbero</span><b>${esc(r.barbero)}</b></div>
          <div><span>Dónde</span><b>${esc(r.direccion || D.direccion || '')}</b></div>
          <div><span>Cuándo</span><b>${esc(r.fechaTxt)}, ${esc(r.hora12)}</b></div>
          <div><span>Precio</span><b>${r.bono ? 'Bono ' + esc(r.bono) + ' · $0' : pesos(r.precio)}</b></div>
        </div>
      </div>
      ${r.mapa ? `<a class="btn sec" target="_blank" rel="noopener" href="${esc(r.mapa)}">Cómo llegar (Google Maps)</a>` : ''}
      <p class="muted">Te escribiremos por WhatsApp para confirmarla. Guarda este enlace para consultar o cancelar tu cita:</p>
      <div class="card" style="word-break:break-all;font-size:13px">${esc(enlace)}</div>
      ${waDest ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(waDest, msg))}">${r.waBarbero ? 'Avisar a ' + esc(r.barbero) + ' por WhatsApp' : 'Avisar por WhatsApp'}</a>` : ''}
      <button class="btn sec" id="otra">Hacer otra reserva</button>`;
    $('#otra').onclick = () => { R.servicio = null; R.barbero = null; R.fecha = null; R.hora = null; vistaReservar(); };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
    $('#err').textContent = e.message;
    if (/ocupar/.test(e.message)) { R.hora = null; cargarHoras(); }
  }
}

/* ---------- Mi cita ---------- */
function vistaMiCita(cita, t) {
  const ult = leerLS('ultimaCita') || {};
  cita = cita || ult.cita || ''; t = t || ult.t || '';
  $('#v-micita').innerHTML = `
    <h2>Consulta tu cita</h2>
    <label for="mc-cita">Código de la cita</label><input id="mc-cita" value="${esc(cita)}" placeholder="CT00012" autocapitalize="characters">
    <label for="mc-tel">WhatsApp con el que reservaste</label><input id="mc-tel" type="tel" inputmode="numeric" value="${esc(t)}" placeholder="300 123 4567">
    <div id="mc-err" class="err"></div>
    <button class="btn" id="mc-buscar">Consultar</button>
    <div id="mc-res"></div>`;
  $('#mc-buscar').onclick = consultar;
  if (cita && t) consultar();
}

async function consultar() {
  const cita = $('#mc-cita').value.trim(), t = $('#mc-tel').value.replace(/\D/g, '');
  if (!cita || t.length < 10) return ($('#mc-err').textContent = 'Escribe el código y tu WhatsApp.');
  $('#mc-err').textContent = ''; $('#mc-res').innerHTML = '<div class="cargando">Buscando…</div>';
  try {
    const r = await api({ a: 'micita', cita, t });
    $('#mc-res').innerHTML = `
      <div class="card ${r.cancelable ? 'ok' : ''}">
        <div class="muted">Hola ${esc(r.cliente)}, tu cita <b>${esc(r.cita)}</b> está:</div>
        <div class="codigo" style="font-size:30px">${esc(r.estado)}</div>
        <div class="resumen">
          <div><span>Servicio</span><b>${esc(r.servicio)}</b></div>
          <div><span>Barbero</span><b>${esc(r.barbero)}</b></div>
          <div><span>Cuándo</span><b>${esc(r.fechaTxt)}, ${esc(r.hora12)}</b></div>
          <div><span>Dónde</span><b>${esc(r.direccion || D.direccion || '')}</b></div>
        </div>
        ${r.mapa ? `<a class="mapa" target="_blank" rel="noopener" href="${esc(r.mapa)}">Cómo llegar ↗</a>` : ''}
      </div>
      ${r.membresia ? `<div class="card"><b>${esc(r.membresia.plan)}</b><div class="muted">Te quedan ${r.membresia.restantes} servicios · vence el ${esc(r.membresia.vence)}</div></div>` : ''}
      ${r.cancelable ? '<button class="btn sec" id="mc-cancelar">Cancelar esta cita</button>' : ''}`;
    if ($('#mc-cancelar')) $('#mc-cancelar').onclick = async () => {
      if (!confirm('¿Seguro que quieres cancelar la cita ' + r.cita + '?')) return;
      const b = $('#mc-cancelar'); b.disabled = true; b.textContent = 'Cancelando…';
      try { await api({ a: 'cancelar', cita, t }, true); consultar(); }
      catch (e) { b.disabled = false; b.textContent = 'Cancelar esta cita'; $('#mc-err').textContent = e.message; }
    };
  } catch (e) { $('#mc-res').innerHTML = ''; $('#mc-err').textContent = e.message; }
}

/* ---------- Bonos de regalo ---------- */
async function aplicarBono(codigo) {
  const c = String(codigo || '').trim().toUpperCase();
  if (!c) throw new Error('Escribe el código del bono.');
  const b = await api({ a: 'bono', codigo: c });
  if (b.estado !== 'Activo') throw new Error('Este bono está ' + b.estado.toLowerCase() + '.');
  if (b.apartado) throw new Error('Este bono ya tiene una cita reservada. Consúltala en "Mi cita".');
  if (!D.servicios.some(s => s.id === b.servicioId)) throw new Error('El servicio de este bono ya no está disponible. Escríbenos por WhatsApp.');
  R.bono = b; R.servicio = null; R.fecha = null; R.hora = null;
  tab('reservar'); vistaReservar();
}

function tarjetaBono(b) {
  return `<div class="regalo">
    <div class="marca"><img src="image.jpg" alt=""><span>BONO DE REGALO</span></div>
    <div class="para">Para<b>${esc(b.para || 'ti')}</b></div>
    <div class="serv">${esc(b.servicio)}</div>
    ${b.mensaje ? `<div class="msg">“${esc(b.mensaje)}”</div>` : ''}
    ${b.de ? `<div class="muted" style="margin-top:8px">De parte de ${esc(b.de)}</div>` : ''}
    <div class="pie"><span>Código <span class="cod">${esc(b.codigo)}</span></span><span>${b.vence ? 'Válido hasta el ' + esc(b.vence) : ''}</span></div>
  </div>`;
}

async function vistaBono(codigo) {
  tab('reservar');
  const v = $('#v-reservar');
  v.innerHTML = '<div class="cargando">Abriendo tu regalo…</div>';
  try {
    const b = await api({ a: 'bono', codigo: codigo });
    const ok = b.estado === 'Activo' && !b.apartado;
    v.innerHTML = '<h2>Tienes un regalo 🎁</h2>' + tarjetaBono(b) +
      (ok ? '<button class="btn" id="reservar-bono">Reservar con este bono</button>'
        : `<p class="card muted">${b.apartado ? 'Este bono ya tiene una cita reservada. Consúltala en "Mi cita".' : 'Este bono está ' + esc(b.estado.toLowerCase()) + '.'}</p>`) +
      '<button class="btn sec" id="ver-web">Ver la barbería</button>';
    if ($('#reservar-bono')) $('#reservar-bono').onclick = async () => { try { await aplicarBono(b.codigo); } catch (e) { alert(e.message); } };
    $('#ver-web').onclick = () => vistaReservar();
  } catch (e) {
    v.innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn sec" id="ver-web">Reservar sin bono</button>`;
    $('#ver-web').onclick = () => vistaReservar();
  }
}

const G = { servicio: null };
function vistaRegalar() {
  const v = $('#v-regalar');
  const yo = leerLS('cliente') || {};
  const servs = D.servicios;
  v.innerHTML = `<h2>Regala un servicio <small>tú lo pagas, otra persona lo disfruta</small></h2>
    <p class="muted">Elige el servicio, escribe para quién es y envía la solicitud. Cuando la barbería confirme tu pago te damos el bono con su código para que se lo envíes.</p>
    <div class="grid">${servs.map(s => `<button class="opt ${s.id === G.servicio ? 'on' : ''}" data-g="${esc(s.id)}"><span class="opt-txt"><b>${esc(s.nombre)}${s.combo ? ' <span class="combo">Combo</span>' : ''}</b>${s.combo ? `<span class="desc">Incluye: ${esc(s.incluyeNombres.join(' + '))}</span>` : (s.desc ? `<span class="desc">${esc(s.desc)}</span>` : '')}</span><span class="meta">${pesos(s.precio)}</span></button>`).join('')}</div>
    ${G.servicio ? `
      <h2>¿Para quién es?</h2>
      <label for="g-para">Nombre de quien recibe</label><input id="g-para" maxlength="60" placeholder="Ej.: Carlos">
      <label for="g-telp">WhatsApp de quien recibe (opcional)</label><input id="g-telp" type="tel" inputmode="numeric" placeholder="300 123 4567">
      <label for="g-msg">Mensaje (opcional)</label><textarea id="g-msg" maxlength="140" placeholder="¡Feliz cumpleaños! Ponte guapo."></textarea>
      <h2>Tus datos</h2>
      <label for="g-nombre">Tu nombre</label><input id="g-nombre" autocomplete="name" value="${esc(yo.nombre || '')}">
      <label for="g-tel">Tu WhatsApp</label><input id="g-tel" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(yo.tel || '')}" placeholder="300 123 4567">
      <div id="g-err" class="err"></div>
      <button class="btn" id="g-enviar">Pedir bono de regalo</button>
      <p class="muted">El bono vale para ${esc((servs.find(s => s.id === G.servicio) || {}).nombre || '')}. Lo pagas por adelantado y queda activo cuando la barbería confirme tu pago.</p>` : ''}`;
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { G.servicio = b.dataset.g; vistaRegalar(); setTimeout(() => { const e = $('#g-para'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50); });
  if ($('#g-enviar')) $('#g-enviar').onclick = async () => {
    const b = $('#g-enviar'); b.disabled = true; b.textContent = 'Enviando…'; $('#g-err').textContent = '';
    try {
      const r = await api({ a: 'regalar', servicio: G.servicio, para: $('#g-para').value, telPara: $('#g-telp').value, mensaje: $('#g-msg').value,
        comprador: $('#g-nombre').value, telComprador: $('#g-tel').value }, true);
      guardar('cliente', { nombre: $('#g-nombre').value.trim(), tel: $('#g-tel').value.replace(/\D/g, '') });
      G.servicio = null;
      v.innerHTML = `<h2>¡Solicitud recibida!</h2>
        <div class="card ok"><div class="muted">Número de solicitud</div><div class="codigo">${esc(r.id)}</div>
          <div class="resumen" style="margin-top:8px">
            <div><span>Regalo</span><b>${esc(r.servicio)}</b></div>
            <div><span>Para</span><b>${esc(r.para)}</b></div>
            <div><span>Valor</span><b>${pesos(r.valor)}</b></div>
          </div></div>
        <div class="card"><b>Cómo pagar</b><p class="muted" style="margin:6px 0 0">${esc(r.datosPago)}</p></div>
        ${r.wa ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(r.wa)}">Enviar el comprobante por WhatsApp</a>` : ''}
        <p class="muted">Cuando confirmemos el pago te enviamos por WhatsApp el bono con su código y un enlace para que se lo reenvíes.</p>
        <button class="btn sec" id="g-otro">Regalar otro servicio</button>`;
      $('#g-otro').onclick = () => vistaRegalar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { b.disabled = false; b.textContent = 'Pedir bono de regalo'; $('#g-err').textContent = e.message; }
  };
}

/* ---------- Planes ---------- */
function vistaPlanes() {
  $('#v-planes').innerHTML = '<h2>Planes mensuales <small>pagas una vez, vienes varias</small></h2>' + D.planes.map(p => `
    <div class="card plan">
      <h3>${esc(p.nombre)}</h3>
      <div class="precio">${pesos(p.precio)}</div>
      <div class="muted">${p.usos} servicios · válido ${p.dias} días</div>
      <ul>${p.incluye.map(s => '<li>' + esc(s) + '</li>').join('')}</ul>
      ${D.whatsapp ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(D.whatsapp, 'Hola, quiero el ' + p.nombre + ' (' + pesos(p.precio) + ').'))}">Lo quiero</a>` : ''}
    </div>`).join('') + '<p class="muted">El plan se activa en la barbería al pagar.</p>';
}

/* ---------- Inicio ---------- */
function pintarDatos() {
  document.title = D.negocio + ' · Reserva tu cita';
  $('#lema').textContent = D.ciudad || '';
  const horas = D.horario.map((h, i) => DIAS[i] + ' ' + (cerrado(h) ? 'cerrado' : h.replace('-', '–'))).slice(1).concat(DIAS[0] + ' ' + (cerrado(D.horario[0]) ? 'cerrado' : D.horario[0].replace('-', '–')));
  $('#info').innerHTML = esc(D.direccion) + (D.ciudad ? ', ' + esc(D.ciudad) : '') + '<br>' + esc(horas.join(' · '));
  if (D.whatsapp) { const s = $('#soporte'); s.href = waLink(D.whatsapp, 'Hola, tengo una pregunta.'); s.classList.remove('hidden'); }
}

(async function iniciar() {
  const q = new URLSearchParams(location.search);
  const previo = leerLS('datos');
  if (previo) { D = previo; D.hoy = fechaISO(new Date()); pintarDatos(); vistaReservar(); }
  try {
    const r = await api({ a: 'datos' });
    D = r; guardar('datos', r); pintarDatos();
    if (!q.get('cita') && !q.get('bono')) vistaReservar();
    cargarFotos();
  } catch (e) {
    if (!previo) $('#v-reservar').innerHTML = '<div class="err">' + esc(e.message) + '</div><button class="btn sec" onclick="location.reload()">Reintentar</button>';
  }
  if (q.get('cita') && D) { tab('micita'); vistaMiCita(q.get('cita'), q.get('t')); }
  else if (q.get('bono') && D) vistaBono(q.get('bono'));
})();
</script>
